<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chess Game Centered</title>

    <!-- chess.js for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        /* Centering page content */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 50px;
            background-color: #ebebeb;
        }
   /* 🔹 NEW: Styled arrow buttons */
    #undoBtn, #redoBtn {
      background: #555;
      border: none;
      color: white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 24px;
      margin: 0 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #undoBtn:hover, #redoBtn:hover {
      background: #777;
    }
        .chessboard {
            width: 500px;
            height: 500px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 2px solid #dddddd;
            font-size: 60px;
            text-align: center;
            line-height: 70px;
            font-family: "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
            user-select: none;
        }

        .chessboard div {
            width: 70px;
            height: 70px;
            cursor: pointer;
        }

        .white {
            background: #ffffff;
        }

        .black {
            background: #004417;
        }

        .selected {
            outline: 3px solid rgb(0, 0, 0);
        }

        .highlight {
            box-shadow: inset 0 0 0 4px limegreen;

        }

        .check {
            background-color: red !important;
            color: white;
        }



        #status {

            margin-top: 100px;
            font-size: 50px;
            font-family: monicha;
              /* 🔹 NEW: Move history area */
    #moveHistory {
      margin-top: 10px;
      font-family: monospac;
      white-space: pre;
      max-width: 300px;
      margin-inline: auto;
      text-align: left;
      background: #111;
      padding: 10px;
      border-radius: 6px;
    }
        }
    </style>
</head>

<body>
  <div id="controls">
  <button id="undoBtn" title="Undo Move">⟲</button>
  <button id="redoBtn" title="Redo Move">⟳</button>
</div>

    <div id="chessboard" class="chessboard"></div>
    <p id="status"></p>
    <div id="moveHistory"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
        const game = new Chess();
        const boardEl = document.getElementById('chessboard');
        const statusEl = document.getElementById('status');
        let selected = null;
        let highlights = [];
         // 🔹 NEW: history stacks
  let historyStack = [];
  let redoStack = [];

        const P = {
            w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
            b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
        };

        const file = i => 'abcdefgh'[i];
        const squareOf = (row, col) => file(col) + (8 - row);




        /* return algebraic square name, ex: 'e1' */
        function sqName(row, col) {
            return 'abcdefgh'[col] + (8 - row);
        }

        /* find the king’s square for the given colour ('w' | 'b') */
        function findKingSquare(color) {
            const b = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = b[r][c];
                    if (p && p.type === 'k' && p.color === color) {
                        return sqName(r, c);
                    }
                }
            }
            return null;
        }


        function renderBoard() {

            boardEl.innerHTML = '';
            const board = game.board();
            const sideInCheck = (game.in_check() || game.in_checkmate()) ? game.turn() : null;
            const kingInCheckSq = sideInCheck ? findKingSquare(sideInCheck) : null;

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const sq = squareOf(row, col);
                    const div = document.createElement('div');
                    div.className = ((row + col) % 2 === 0) ? 'white' : 'black';
                    div.dataset.square = sq;

                    if (sq === selected) div.classList.add('selected');
                    if (highlights.includes(sq)) div.classList.add('highlight');
                    if (sq === kingInCheckSq) div.classList.add('check');

                    const piece = board[row][col];
                    if (piece) div.textContent = P[piece.color][piece.type];
                    boardEl.appendChild(div);
                }
            }
            updateStatus();
             updateMoveHistory(); // 🔹 NEW: update move history
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                statusEl.textContent = `Checkmate – ${game.turn() === 'w' ? 'Black' : 'White'} wins!`;
            } else if (game.in_draw()) {
                statusEl.textContent = 'Draw.';
            } else {
                statusEl.textContent = `${game.turn() === 'w' ? 'White' : 'Black'} to move${game.in_check() ? ' (check)' : ''}`;
            }
        }
          // 🔹 NEW: show move history
  function updateMoveHistory() {
    const moveEl = document.getElementById('moveHistory');
    let out = '';
    historyStack.forEach((m, i) => {
      out += `${i + 1}. ${m.from} → ${m.to}\n`;
    });
    moveEl.textContent = out.trim();
  }

        function onSquareClick(e) {
            const sq = e.target.dataset.square;
            if (!sq) return;

            if (selected) {
                const move = game.move({ from: selected, to: sq, promotion: 'q' });
                if (move) {
                    selected = null;
                    highlights = [];
                } else if (game.get(sq) && game.get(sq).color === game.turn()) {
                    selectSquare(sq);
                } else {
                    return;
                }
                renderBoard();
                return;
            }

            selectSquare(sq);
        }
        

        function selectSquare(sq) {
            const piece = game.get(sq);
            if (!piece || piece.color !== game.turn()) return;

            selected = sq;
            highlights = game.moves({ square: sq, verbose: true }).map(m => m.to);
            renderBoard();
        }

        boardEl.addEventListener('click', onSquareClick);
         // 🔹 NEW: Undo button behavior
  document.getElementById('undoBtn').addEventListener('click', () => {
    const move = game.undo();
    if (move) {
      redoStack.push(move);
      historyStack.pop();
      selected = null;
      highlights = [];
      renderBoard();
         }
  });
   // 🔹 NEW: Redo button behavior
  document.getElementById('redoBtn').addEventListener('click', () => {
    if (redoStack.length === 0) return;
    const move = redoStack.pop();
    game.move(move);
    historyStack.push(move);
    selected = null;
    highlights = [];
    renderBoard();
  });
         renderBoard();
        


    </script>

</body>

</html>
